services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sicor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/sicor
      IMAGES_DIR: /app/data/images
      SYNC_SECRET: ${SYNC_SECRET:?SYNC_SECRET is required}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sicor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sicor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicor -d sicor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_data:
